<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 170 1680 530" width="1680" height="530" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <g font-family="Space Grotesk, Segoe UI, Arial, sans-serif" fill="#1a1a1a">

    <!-- J1: mains terminal -->
    <rect x="60" y="215" width="50" height="370" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="85" cy="250" r="10" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="85" cy="550" r="10" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <text x="85" y="198" text-anchor="middle" font-size="24" font-weight="700">J1</text>
    <text x="85" y="622" text-anchor="middle" font-size="22" font-family="Space Mono, Consolas, monospace">127 V CA</text>
    <text x="122" y="238" font-size="22" font-weight="700">L</text>
    <text x="122" y="538" font-size="22" font-weight="700">N</text>

    <!-- Line: J1 -> F1 -> U2 -->
    <line x1="95" y1="250" x2="230" y2="250" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M230 250 C255 224 255 224 280 250 S305 276 330 250" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="230" cy="250" r="4"/>
    <circle cx="330" cy="250" r="4"/>
    <text x="280" y="196" text-anchor="middle" font-size="24" font-weight="700">F1</text>
    <text x="280" y="224" text-anchor="middle" font-size="20" font-family="Space Mono, Consolas, monospace">T315 mA</text>
    <line x1="330" y1="250" x2="560" y2="250" stroke="#1a1a1a" stroke-width="3"/>

    <!-- Neutral -->
    <line x1="95" y1="550" x2="560" y2="550" stroke="#1a1a1a" stroke-width="3"/>

    <!-- RV1 varistor -->
    <circle cx="420" cy="250" r="6"/>
    <circle cx="420" cy="550" r="6"/>
    <line x1="420" y1="250" x2="420" y2="340" stroke="#1a1a1a" stroke-width="3"/>
    <polyline points="420,340 435,350 405,370 435,390 405,410 435,430 405,450 420,460" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="miter"/>
    <polyline points="383,482 395,482 455,320" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="420" y1="460" x2="420" y2="550" stroke="#1a1a1a" stroke-width="3"/>
    <text x="392" y="388" text-anchor="end" font-size="24" font-weight="700">RV1</text>
    <text x="392" y="414" text-anchor="end" font-size="20" font-family="Space Mono, Consolas, monospace">TVR10241</text>

    <!-- U2 HLK-PM03 -->
    <rect x="560" y="210" width="240" height="380" fill="#f2f2ee" stroke="#1a1a1a" stroke-width="3"/>
    <text x="572" y="258" font-size="20" font-family="Space Mono, Consolas, monospace">AC/L</text>
    <text x="572" y="558" font-size="20" font-family="Space Mono, Consolas, monospace">AC/N</text>
    <text x="788" y="258" text-anchor="end" font-size="20" font-family="Space Mono, Consolas, monospace">+Vout</text>
    <text x="788" y="558" text-anchor="end" font-size="20" font-family="Space Mono, Consolas, monospace">−Vout</text>
    <text x="680" y="378" text-anchor="middle" font-size="24" font-weight="700">U2</text>
    <text x="680" y="406" text-anchor="middle" font-size="24" font-weight="700">HLK-PM03</text>
    <text x="680" y="440" text-anchor="middle" font-size="18" font-family="Space Mono, Consolas, monospace">127 V CA → 3.3 V</text>
    <text x="680" y="464" text-anchor="middle" font-size="18" font-family="Space Mono, Consolas, monospace">aislada · 3 W</text>

    <!-- Rails -->
    <line x1="800" y1="250" x2="1610" y2="250" stroke="#1e90ff" stroke-width="4"/>
    <line x1="800" y1="550" x2="1610" y2="550" stroke="#1a1a1a" stroke-width="3"/>
    <text x="814" y="236" font-size="22" font-weight="700" fill="#0b66cc">+3V3</text>
    <text x="814" y="536" font-size="22" font-weight="700">GND</text>

    <!-- C1 electrolytic -->
    <circle cx="880" cy="250" r="6" fill="#1e90ff"/>
    <circle cx="880" cy="550" r="6"/>
    <line x1="880" y1="250" x2="880" y2="388" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="848" y1="388" x2="912" y2="388" stroke="#1a1a1a" stroke-width="4"/>
    <path d="M846 422 Q880 398 914 422" fill="none" stroke="#1a1a1a" stroke-width="4"/>
    <line x1="880" y1="410" x2="880" y2="550" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M826 370 h20 M836 360 v20" stroke="#1a1a1a" stroke-width="3"/>
    <text x="925" y="396" font-size="24" font-weight="700">C1</text>
    <text x="925" y="422" font-size="20" font-family="Space Mono, Consolas, monospace">100 µF</text>

    <!-- Ground symbol -->
    <circle cx="965" cy="550" r="6"/>
    <line x1="965" y1="550" x2="965" y2="582" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="939" y1="582" x2="991" y2="582" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="949" y1="592" x2="981" y2="592" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="959" y1="602" x2="971" y2="602" stroke="#1a1a1a" stroke-width="3"/>

    <!-- C2 ceramic -->
    <circle cx="1050" cy="250" r="6" fill="#1e90ff"/>
    <circle cx="1050" cy="550" r="6"/>
    <line x1="1050" y1="250" x2="1050" y2="388" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="1018" y1="388" x2="1082" y2="388" stroke="#1a1a1a" stroke-width="4"/>
    <line x1="1018" y1="412" x2="1082" y2="412" stroke="#1a1a1a" stroke-width="4"/>
    <line x1="1050" y1="412" x2="1050" y2="550" stroke="#1a1a1a" stroke-width="3"/>
    <text x="1094" y="396" font-size="24" font-weight="700">C2</text>
    <text x="1094" y="422" font-size="20" font-family="Space Mono, Consolas, monospace">100 nF</text>

    <!-- U1 XIAO ESP32-C6 -->
    <circle cx="1230" cy="250" r="6" fill="#1e90ff"/>
    <circle cx="1230" cy="550" r="6"/>
    <line x1="1230" y1="250" x2="1230" y2="310" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="1230" y1="520" x2="1230" y2="550" stroke="#1a1a1a" stroke-width="3"/>
    <rect x="1170" y="310" width="220" height="210" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
    <text x="1230" y="338" text-anchor="middle" font-size="18" font-family="Space Mono, Consolas, monospace">3V3</text>
    <text x="1230" y="510" text-anchor="middle" font-size="18" font-family="Space Mono, Consolas, monospace">GND</text>
    <text x="1185" y="392" font-size="24" font-weight="700">U1</text>
    <text x="1185" y="420" font-size="22" font-weight="700">XIAO ESP32-C6</text>
    <text x="1380" y="461" text-anchor="end" font-size="18" font-family="Space Mono, Consolas, monospace">D6 · TX</text>
    <text x="1380" y="501" text-anchor="end" font-size="18" font-family="Space Mono, Consolas, monospace">D7 · RX</text>

    <!-- UART lines -->
    <line x1="1390" y1="455" x2="1458" y2="455" stroke="#1a1a1a" stroke-width="3" marker-end="url(#ah)"/>
    <line x1="1460" y1="495" x2="1392" y2="495" stroke="#1a1a1a" stroke-width="3" marker-end="url(#ah)"/>

    <!-- U3 AJ-SR04M -->
    <line x1="1610" y1="250" x2="1610" y2="310" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="1610" y1="520" x2="1610" y2="550" stroke="#1a1a1a" stroke-width="3"/>
    <rect x="1460" y="310" width="190" height="210" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
    <text x="1610" y="338" text-anchor="middle" font-size="18" font-family="Space Mono, Consolas, monospace">VCC</text>
    <text x="1610" y="510" text-anchor="middle" font-size="18" font-family="Space Mono, Consolas, monospace">GND</text>
    <text x="1474" y="392" font-size="24" font-weight="700">U3</text>
    <text x="1474" y="420" font-size="22" font-weight="700">AJ-SR04M</text>
    <text x="1470" y="461" font-size="18" font-family="Space Mono, Consolas, monospace">RX · Trig</text>
    <text x="1470" y="501" font-size="18" font-family="Space Mono, Consolas, monospace">TX · Echo</text>

    <!-- Stage captions -->
    <g font-size="20" fill="#6b6b66" font-family="Space Mono, Consolas, monospace">
      <text x="300" y="668" text-anchor="middle">Entrada de red y protección</text>
      <text x="680" y="668" text-anchor="middle">Fuente aislada</text>
      <text x="980" y="668" text-anchor="middle">Desacoplo</text>
      <text x="1410" y="668" text-anchor="middle">Control y sensor (UART 9600)</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
